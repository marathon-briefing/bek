name: Daily Student Notification

on:
  schedule:
    # 每天台北時間 06:00（UTC 22:00）
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '測試模式（勾選＝只寄教練，不寄學員）'
        type: boolean
        default: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Send daily notification to students
        env:
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ARGS: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python daily_notification_cloud.py
